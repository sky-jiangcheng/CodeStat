      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="55%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#66bb6a"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="104" ry="104" fill="url(#bg)"/>
