<!doctype html>
<html><head><meta charset="utf-8"><style>
  body{margin:0;font-family:-apple-system,sans-serif}
  .row{display:flex;align-items:center;gap:24px;padding:24px 32px;border-bottom:1px solid #ccc}
  .dark{background:#0b0b0c;color:#eee}
  .light{background:#eceae6;color:#222}
  .dark .label{color:#aaa}
  .label{font-size:12px;width:120px;color:#666}
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px}
  .cell span{font-size:10px;opacity:.6}
  img{display:block;image-rendering:auto}
  .checker{background:
    repeating-conic-gradient(#cfcfcf 0% 25%, #fff 0% 50%) 0/16px 16px; padding:12px; border-radius:6px}
  h2{font-size:13px;font-weight:600;margin:0 0 4px;opacity:.7}
</style></head><body>
  <div class="row light"><div class="label"><h2>Master</h2>light bg</div>
    <div class="cell"><img src="icon-512.png" width="128"><span>512</span></div>
    <div class="cell"><img src="icon-256.png" width="128"><span>256</span></div>
    <div class="cell"><img src="icon-128.png" width="128"><span>128</span></div>
    <div class="cell"><img src="icon-64.png" width="64"><span>64</span></div>
    <div class="cell"><img src="icon-48.png" width="48"><span>48</span></div>
    <div class="cell"><img src="icon-32.png" width="32"><span>32</span></div>
    <div class="cell"><img src="icon-16.png" width="16"><span>16</span></div>
  </div>
  <div class="row dark"><div class="label"><h2>Master</h2>dark bg</div>
    <div class="cell"><img src="icon-512.png" width="128"><span>512</span></div>
    <div class="cell"><img src="icon-256.png" width="128"><span>256</span></div>
    <div class="cell"><img src="icon-128.png" width="128"><span>128</span></div>
    <div class="cell"><img src="icon-64.png" width="64"><span>64</span></div>
    <div class="cell"><img src="icon-48.png" width="48"><span>48</span></div>
    <div class="cell"><img src="icon-32.png" width="32"><span>32</span></div>
    <div class="cell"><img src="icon-16.png" width="16"><span>16</span></div>
  </div>
  <div class="row light"><div class="label"><h2>Checker</h2>transparency</div>
    <div class="checker"><img src="icon-512.png" width="160"></div>
    <div class="checker"><img src="icon-128.png" width="96"></div>
    <div class="checker"><img src="icon-32.png" width="48"></div>
    <div class="checker"><img src="icon-16.png" width="48"></div>
  </div>
</body></html>
