<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a1a" />
    <title>GitBuddy - 离线</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #1a1a1a; color: #eee; display: flex;
        align-items: center; justify-content: center; min-height: 100vh;
        text-align: center; padding: 24px;
      }
      .card { max-width: 420px; }
      h1 { font-size: 28px; margin-bottom: 12px; }
      p { color: #aaa; line-height: 1.7; margin-bottom: 24px; }
      button {
        background: #4caf50; color: #fff; border: 0; border-radius: 8px;
        padding: 12px 28px; font-size: 15px; cursor: pointer;
      }
      button:hover { background: #43a047; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>当前离线</h1>
      <p>网络连接已断开，无法加载 GitBuddy。请检查网络后重试。</p>
      <button onclick="window.location.reload()">重新加载</button>
    </div>
  </body>
</html>
