name: 文档改进
description: 报告文档问题或建议改进文档
title: "[Docs]: "
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: "用于 README、docs/ 落地页、CHANGELOG 等文档的改进建议。"
  - type: textarea
    id: issue
    attributes:
      label: 问题描述
      description: 哪里有问题？是信息缺失、错误、过时，还是难以理解？
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: 位置
      description: 文档文件与章节（如 README.md 的「快速开始」）
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 改进建议
      description: 你希望如何改进？
