name: 功能建议
description: 建议新功能或改进
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "描述你的功能想法。清晰的需求描述能显著加速实现。"
  - type: textarea
    id: background
    attributes:
      label: 背景与动机
      description: 你为什么需要这个功能？当前遇到了什么不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望功能如何工作？
      placeholder: |
        - 交互流程
        - 界面位置
        - 与现有功能的关系
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 如何判断该功能完成？
      placeholder: |
        - [ ] 场景 A 可正常使用
        - [ ] 性能指标 B 达成
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法（可选）
